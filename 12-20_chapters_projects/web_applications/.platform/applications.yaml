ll_project:
  source:
    root: "/"

  type: "python:3.12"

  relationships:
    database:
      service: db
      endpoint: postgresql

  disk: 512

  mounts:
    "logs":
      source: local
      source_path: logs

  web:
    upstream:
      socket_family: unix

    commands:
      start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"

    locations:
      "/":
        passthru: true

      "/static":
        root: "static"
        expires: 1h
        allow: true

  hooks:
    build: |
      set -eu
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install -r requirements_remote.txt
      mkdir -p logs
      python manage.py collectstatic --noinput
      rm -rf logs

    deploy: |
      python manage.py migrate
